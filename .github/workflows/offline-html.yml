
name: Build Offline OCR HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/offline-html.yml"
      - "offline-html/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

      - name: Download Tesseract.js
        run: |
          mkdir -p offline-html/vendor
          cd offline-html/vendor
          npm pack tesseract.js@5.1.1
          tar -xzf tesseract.js-5.1.1.tgz
          cp package/dist/tesseract.min.js tesseract.min.js

      - name: Download OCR core
        run: |
          mkdir -p offline-html/vendor/core
          cd offline-html/vendor/core
          curl -L \
            https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core.wasm.js \
            -o tesseract-core.wasm.js
          curl -L \
            https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core.wasm \
            -o tesseract-core.wasm

      - name: Download language data
        run: |
          mkdir -p offline-html/vendor/lang
          curl -L \
            https://tessdata.projectnaptha.com/4.0.0/kor.traineddata.gz \
            -o offline-html/vendor/lang/kor.traineddata.gz
          curl -L \
            https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz \
            -o offline-html/vendor/lang/eng.traineddata.gz

      - name: Build single HTML
        run: |
          node offline-html/build.mjs

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Scanner-Pro-Offline
          path: dist/OCR-Scanner-Pro-Offline.html
          if-no-files-found: error
          retention-days: 30
