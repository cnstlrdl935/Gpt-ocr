
name: Build OCR Scanner Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -o OCRScanner_Pro_Integrated_source.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p OCRScanner_Pro \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OCRScanner-Pro-debug
          path: OCRScanner_Pro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
