
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Scanner Pro Offline</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
main {
  max-width: 720px;
  margin: auto;
}
h1 { font-size: 25px; }
button, select, input, textarea {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 9px;
  border: 1px solid #64748b;
  font-size: 16px;
}
button {
  background: #2563eb;
  color: white;
  border: 0;
}
button:disabled { opacity: .5; }
textarea {
  min-height: 230px;
  background: #1e293b;
  color: white;
}
#preview {
  max-width: 100%;
  margin-top: 12px;
}
#status {
  padding: 12px;
  background: #1e293b;
  border-radius: 8px;
}
</style>
</head>
<body>
<main>
<h1>OCR Scanner Pro</h1>
<p>한국어 · English · Offline OCR</p>

<input id="file" type="file" accept="image/*">

<img id="preview" hidden>

<select id="language">
  <option value="kor+eng">한국어 + 영어</option>
  <option value="kor">한국어</option>
  <option value="eng">English</option>
</select>

<button id="recognize">문자 인식 시작</button>
<button id="copy">텍스트 복사</button>
<button id="save">TXT 저장</button>

<p id="status">이미지를 선택해 주세요.</p>

<textarea id="result"
placeholder="인식한 글자가 여기에 표시됩니다."></textarea>
</main>

<script>
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const result = document.getElementById("result");
const statusBox = document.getElementById("status");
const recognizeButton = document.getElementById("recognize");

let imageFile = null;

fileInput.addEventListener("change", () => {
  imageFile = fileInput.files[0];

  if (!imageFile) return;

  preview.src = URL.createObjectURL(imageFile);
  preview.hidden = false;
  statusBox.textContent = "이미지를 불러왔습니다.";
});

recognizeButton.addEventListener("click", async () => {
  if (!imageFile) {
    alert("먼저 이미지를 선택해 주세요.");
    return;
  }

  if (!window.Tesseract) {
    statusBox.textContent = "OCR 엔진을 불러오지 못했습니다.";
    return;
  }

  recognizeButton.disabled = true;
  statusBox.textContent = "OCR 처리 중입니다.";

  let worker;

  try {
    worker = await Tesseract.createWorker(
      document.getElementById("language").value,
      1,
      {
        workerPath: window.OCR_WORKER_URL,
        corePath: window.OCR_CORE_URL,
        langPath: window.OCR_LANG_URL,
        gzip: true,
        logger: message => {
          if (message.status) {
            statusBox.textContent =
              message.status + " " +
              Math.round((message.progress || 0) * 100) + "%";
          }
        }
      }
    );

    const response = await worker.recognize(imageFile);
    result.value = response.data.text;
    statusBox.textContent = "문자 인식 완료";
  } catch (error) {
    statusBox.textContent =
      "오류: " + (error.message || error);
  } finally {
    if (worker) await worker.terminate();
    recognizeButton.disabled = false;
  }
});

document.getElementById("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(result.value);
    statusBox.textContent = "복사 완료";
  } catch {
    result.select();
    statusBox.textContent = "텍스트를 선택했습니다. 복사해 주세요.";
  }
});

document.getElementById("save").addEventListener("click", () => {
  const blob = new Blob([result.value], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "OCR-Result.txt";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
