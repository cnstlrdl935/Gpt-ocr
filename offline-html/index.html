<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>OCR Scanner Pro</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f8fafc;padding:20px}
main{max-width:760px;margin:auto}
h1{font-size:1.7rem;margin:.3rem 0}
p{color:#cbd5e1;line-height:1.55}
.panel{background:#172235;border:1px solid #334155;border-radius:16px;padding:16px;margin:14px 0}
label{display:block;font-weight:650;margin:12px 0 6px}
input,select,textarea,button{font:inherit;width:100%;border-radius:10px;padding:12px;margin:5px 0}
input,select,textarea{background:#0f172a;color:#f8fafc;border:1px solid #475569}
button{border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.secondary{background:#334155}
#preview{display:block;max-width:100%;max-height:360px;margin:12px auto;border-radius:10px}
textarea{min-height:240px;resize:vertical;line-height:1.5}
#status{padding:10px;background:#0f172a;border-radius:9px;min-height:42px}
progress{width:100%;height:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
small{color:#94a3b8}
</style>
</head>
<body>
<main>
<h1>OCR Scanner Pro</h1>
<p>이미지에서 한국어와 영어 문자를 추출합니다. OCR 엔진은 인터넷을 통해 불러옵니다.</p>
<section class="panel">
<label for="image">이미지 선택 또는 카메라 촬영</label>
<input id="image" type="file" accept="image/*" capture="environment">
<img id="preview" alt="선택한 이미지 미리보기" hidden>
<label for="language">인식 언어</label>
<select id="language">
<option value="kor+eng">한국어 + 영어</option>
<option value="kor">한국어</option>
<option value="eng">영어</option>
</select>
<button id="run">문자 인식 시작</button>
<div id="status" role="status" aria-live="polite">이미지를 선택해 주세요.</div>
<progress id="progress" max="1" value="0"></progress>
</section>
<section class="panel">
<label for="output">인식 결과 (직접 수정 가능)</label>
<textarea id="output" placeholder="인식된 문자가 여기에 표시됩니다."></textarea>
<div class="actions">
<button id="copy" class="secondary">결과 복사</button>
<button id="save" class="secondary">TXT 저장</button>
</div>
</section>
<small>참고: 처음 실행할 때 OCR 엔진과 언어 데이터 다운로드가 필요합니다. 이후에도 브라우저 캐시 상태에 따라 인터넷 연결이 필요할 수 있습니다.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let selectedFile=null;
$("image").addEventListener("change",()=>{
 selectedFile=$("image").files?.[0]||null;
 if(!selectedFile)return;
 $("preview").src=URL.createObjectURL(selectedFile);
 $("preview").hidden=false;
 $("status").textContent="이미지를 불러왔습니다.";
 $("progress").value=0;
});
$("run").addEventListener("click",async()=>{
 if(!selectedFile){$("status").textContent="먼저 이미지를 선택해 주세요.";return;}
 if(!window.Tesseract){$("status").textContent="OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";return;}
 const button=$("run");button.disabled=true;$("output").value="";$("progress").value=0;
 let worker;
 try{
  $("status").textContent="OCR 엔진을 준비하고 있습니다.";
  worker=await Tesseract.createWorker($("language").value,1,{
   workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
   corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
   langPath:"https://tessdata.projectnaptha.com/4.0.0",
   gzip:true,
   logger:m=>{
    if(m.status)$("status").textContent=m.status;
    if(typeof m.progress==="number")$("progress").value=m.progress;
   }
  });
  const {data}=await worker.recognize(selectedFile);
  $("output").value=data.text||"인식된 문자가 없습니다.";
  $("status").textContent="문자 인식이 완료되었습니다.";
 }catch(e){
  $("status").textContent="오류가 발생했습니다: "+(e?.message||String(e));
 }finally{
  if(worker){try{await worker.terminate();}catch{}}
  button.disabled=false;
 }
});
$("copy").addEventListener("click",async()=>{
 const text=$("output").value;
 if(!text){$("status").textContent="복사할 결과가 없습니다.";return;}
 try{await navigator.clipboard.writeText(text);$("status").textContent="결과를 복사했습니다.";}
 catch{$("output").focus();$("output").select();$("status").textContent="결과를 선택했습니다. 복사해 주세요.";}
});
$("save").addEventListener("click",()=>{
 const blob=new Blob(["\uFEFF",$("output").value],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");
 a.href=url;a.download="OCR-result.txt";a.click();URL.revokeObjectURL(url);
});
</script>
</body>
</html>
