<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f2">
<meta name="description" content="이미지에서 한국어와 영어 문자를 추출하는 간단한 OCR 도구입니다.">
<title>문자 추출기</title>
<style>
:root{font-family:Arial,"Noto Sans KR",sans-serif;color:#242424;background:#f5f5f2}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px}
main{width:min(100%,720px);margin:0 auto}
header{padding:0 0 22px;border-bottom:1px solid #d8d8d2}
h1{font-size:27px;font-weight:700;letter-spacing:-.7px;margin:0 0 8px}
p{line-height:1.6;color:#666;margin:6px 0}
header p{font-size:14px}
section{padding:22px 0;border-bottom:1px solid #d8d8d2}
h2{font-size:17px;margin:0 0 15px;font-weight:700}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 7px}
input,select,textarea,button{font:inherit;font-size:14px}
input[type=file],select,textarea{width:100%;padding:11px;background:#fff;border:1px solid #c9c9c2;border-radius:4px;color:#242424}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #666;outline-offset:2px}
#preview{display:block;max-width:100%;max-height:360px;margin:14px 0 4px;object-fit:contain;background:#e9e9e4}
#preview[hidden]{display:none}
button{border:1px solid #333;border-radius:4px;padding:11px 16px;background:#333;color:#fff;cursor:pointer;font-weight:700}
button:hover:not(:disabled){background:#555}
button:disabled{opacity:.5;cursor:wait}
button.secondary{background:#fff;color:#333;border-color:#bcbcb5}
button.secondary:hover:not(:disabled){background:#ededE8}
#run{width:100%;margin-top:16px}
#status{font-size:13px;color:#555;margin-top:12px;min-height:20px}
progress{width:100%;height:8px;margin-top:8px;accent-color:#555}
textarea{min-height:220px;resize:vertical;line-height:1.6}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.hint{font-size:12px;color:#777}
footer{padding:18px 0}
@media(max-width:480px){body{padding:22px 14px}.actions{flex-direction:column}.actions button{width:100%;min-height:44px}#run{min-height:46px}}
</style>
</head>
<body>
<main>
<header>
<h1>문자 추출기</h1>
<p>이미지 파일에 있는 한국어와 영어 문자를 추출합니다.</p>
</header>

<section aria-labelledby="image-title">
<h2 id="image-title">1. 이미지 선택</h2>
<label for="image">파일 선택</label>
<input id="image" type="file" accept="image/*">
<p class="hint">기기에 저장된 이미지 파일을 선택해 주세요. 카메라가 자동으로 실행되지 않습니다.</p>
<img id="preview" alt="선택한 이미지 미리보기" hidden>

<label for="language">인식 언어</label>
<select id="language">
<option value="kor+eng">한국어 및 영어</option>
<option value="kor">한국어</option>
<option value="eng">영어</option>
</select>
<button id="run" type="button">문자 추출</button>
<div id="status" role="status" aria-live="polite">선택한 이미지가 없습니다.</div>
<progress id="progress" max="1" value="0" aria-label="인식 진행률"></progress>
</section>

<section aria-labelledby="result-title">
<h2 id="result-title">2. 추출 결과</h2>
<label for="output">인식된 문자</label>
<textarea id="output" placeholder="추출된 문자가 여기에 표시됩니다. 필요하면 직접 수정할 수 있습니다."></textarea>
<div class="actions">
<button id="copy" class="secondary" type="button">복사</button>
<button id="save" class="secondary" type="button">TXT로 저장</button>
</div>
</section>

<footer>
<p class="hint">문자 인식 기능은 Tesseract.js를 사용합니다. 최초 실행 시 OCR 엔진과 언어 데이터를 인터넷에서 내려받습니다.</p>
</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let selectedFile = null;
let previewUrl = null;

$("image").addEventListener("change", () => {
  selectedFile = $("image").files && $("image").files[0] ? $("image").files[0] : null;
  $("progress").value = 0;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  if (!selectedFile) {
    $("preview").hidden = true;
    $("preview").removeAttribute("src");
    $("status").textContent = "선택한 이미지가 없습니다.";
    return;
  }
  if (!selectedFile.type.startsWith("image/")) {
    selectedFile = null;
    $("image").value = "";
    $("preview").hidden = true;
    $("status").textContent = "이미지 파일만 선택할 수 있습니다.";
    return;
  }
  previewUrl = URL.createObjectURL(selectedFile);
  $("preview").src = previewUrl;
  $("preview").hidden = false;
  $("status").textContent = "이미지를 불러왔습니다. 문자 추출을 누르세요.";
});

$("run").addEventListener("click", async () => {
  if (!selectedFile) {
    $("status").textContent = "먼저 이미지 파일을 선택해 주세요.";
    return;
  }
  if (!window.Tesseract) {
    $("status").textContent = "OCR 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.";
    return;
  }
  const button = $("run");
  button.disabled = true;
  $("copy").disabled = true;
  $("save").disabled = true;
  $("progress").value = 0;
  let worker;
  try {
    $("status").textContent = "문자를 읽는 중입니다. 처음 실행할 때는 시간이 더 걸릴 수 있습니다.";
    worker = await Tesseract.createWorker($("language").value, 1, {
      workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
      corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
      langPath: "https://tessdata.projectnaptha.com/4.0.0",
      gzip: true,
      logger: message => {
        if (message.status) $("status").textContent = "처리 중: " + message.status;
        if (typeof message.progress === "number") $("progress").value = message.progress;
      }
    });
    const result = await worker.recognize(selectedFile);
    $("output").value = result.data.text || "인식된 문자가 없습니다. 다른 이미지로 다시 시도해 주세요.";
    $("progress").value = 1;
    $("status").textContent = "문자 추출이 끝났습니다.";
  } catch (error) {
    console.error(error);
    $("status").textContent = "오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. (" + (error && error.message ? error.message : "알 수 없는 오류") + ")";
  } finally {
    if (worker) {
      try { await worker.terminate(); } catch (error) { console.warn(error); }
    }
    button.disabled = false;
    $("copy").disabled = false;
    $("save").disabled = false;
  }
});

$("copy").addEventListener("click", async () => {
  const value = $("output").value;
  if (!value.trim()) {
    $("status").textContent = "복사할 내용이 없습니다.";
    return;
  }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
    } else {
      $("output").focus();
      $("output").select();
      if (!document.execCommand("copy")) throw new Error("copy unavailable");
    }
    $("status").textContent = "결과를 복사했습니다.";
  } catch (error) {
    $("output").focus();
    $("output").select();
    $("status").textContent = "자동 복사에 실패했습니다. 선택된 글자를 길게 눌러 복사해 주세요.";
  }
});

$("save").addEventListener("click", () => {
  const value = $("output").value;
  if (!value.trim()) {
    $("status").textContent = "저장할 내용이 없습니다.";
    return;
  }
  const blob = new Blob(["\uFEFF", value], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "text-result.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("status").textContent = "TXT 파일 저장을 시작했습니다.";
});

window.addEventListener("beforeunload", () => {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
});
</script>
</body>
</html>
