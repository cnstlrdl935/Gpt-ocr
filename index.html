<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="이미지에서 한국어와 영어 문자를 추출하는 간편한 OCR 도구입니다.">
<title>GPT OCR — 이미지 문자 인식</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#0b1220;color:#f8fafc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(14px,3vw,28px);background:radial-gradient(ellipse at top,#172b49 0,#0b1220 55%)}
main{width:min(100%,820px);margin:0 auto}
header{padding:12px 2px 18px}
.eyebrow{color:#93c5fd;font-size:.78rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(1.8rem,5vw,2.5rem);letter-spacing:-.04em;margin:.35rem 0}
p{color:#cbd5e1;line-height:1.65;margin:.45rem 0}
.panel{background:#111e31;border:1px solid #2b405d;border-radius:18px;padding:clamp(14px,3vw,22px);margin:14px 0;box-shadow:0 12px 35px #0003}
label{display:block;font-weight:700;margin:12px 0 7px}
input,select,textarea,button{font:inherit;width:100%;border-radius:11px;padding:12px;margin:5px 0}
input,select,textarea{background:#0b1627;color:#f8fafc;border:1px solid #405570}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
input[type=file]{padding:10px}
button{border:0;background:#2563eb;color:white;font-weight:750;cursor:pointer;transition:filter .15s,transform .15s}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#2b405d}
#preview{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:14px auto 4px;border-radius:12px}
#preview[hidden]{display:none}
textarea{min-height:230px;resize:vertical;line-height:1.6}
#status{padding:12px;background:#0b1627;border:1px solid #2b405d;border-radius:10px;min-height:46px;color:#dbeafe}
progress{width:100%;height:12px;margin:10px 0 2px;accent-color:#3b82f6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hint{font-size:.88rem;color:#94a3b8}
footer{padding:10px 2px 24px}
@media(max-width:480px){body{padding:12px}.actions{grid-template-columns:1fr}button{min-height:46px}}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">Simple image text recognition</div>
<h1>GPT OCR</h1>
<p>이미지에서 한국어와 영어 문자를 추출합니다. 사진을 선택하거나 휴대전화 카메라로 촬영한 뒤 문자 인식을 시작하세요.</p>
</header>
<section class="panel" aria-labelledby="input-title">
<h2 id="input-title">이미지 입력</h2>
<label for="image">이미지 선택 또는 카메라 촬영</label>
<input id="image" type="file" accept="image/*" capture="environment">
<p class="hint">PNG, JPG 등 브라우저에서 열 수 있는 이미지 파일을 사용하세요.</p>
<img id="preview" alt="선택한 이미지 미리보기" hidden>
<label for="language">인식 언어</label>
<select id="language">
<option value="kor+eng">한국어 + 영어</option>
<option value="kor">한국어</option>
<option value="eng">영어</option>
</select>
<button id="run" type="button">문자 인식 시작</button>
<div id="status" role="status" aria-live="polite">이미지를 선택해 주세요.</div>
<progress id="progress" max="1" value="0" aria-label="문자 인식 진행률"></progress>
</section>
<section class="panel" aria-labelledby="result-title">
<h2 id="result-title">인식 결과</h2>
<label for="output">인식된 문자 (직접 수정 가능)</label>
<textarea id="output" placeholder="인식된 문자가 여기에 표시됩니다."></textarea>
<div class="actions">
<button id="copy" class="secondary" type="button">결과 복사</button>
<button id="save" class="secondary" type="button">TXT 파일 저장</button>
</div>
</section>
<footer><p class="hint">OCR 엔진과 언어 데이터는 Tesseract.js를 통해 인터넷에서 불러옵니다. 이미지 인식은 사용 중인 브라우저에서 처리되며, 최초 실행 시 다운로드 시간이 걸릴 수 있습니다.</p></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let selectedFile = null;
let previewUrl = null;

$("image").addEventListener("change", () => {
  selectedFile = $("image").files && $("image").files[0] ? $("image").files[0] : null;
  $("progress").value = 0;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  if (!selectedFile) {
    $("preview").hidden = true;
    $("status").textContent = "이미지를 선택해 주세요.";
    return;
  }
  if (!selectedFile.type.startsWith("image/")) {
    selectedFile = null;
    $("image").value = "";
    $("preview").hidden = true;
    $("status").textContent = "이미지 파일만 선택할 수 있습니다.";
    return;
  }
  previewUrl = URL.createObjectURL(selectedFile);
  $("preview").src = previewUrl;
  $("preview").hidden = false;
  $("status").textContent = "이미지를 불러왔습니다. 인식 언어를 선택한 뒤 시작하세요.";
});

$("run").addEventListener("click", async () => {
  if (!selectedFile) {
    $("status").textContent = "먼저 이미지 파일을 선택해 주세요.";
    return;
  }
  if (!window.Tesseract) {
    $("status").textContent = "OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 콘텐츠 차단 설정을 확인한 뒤 새로고침해 주세요.";
    return;
  }
  const button = $("run");
  button.disabled = true;
  $("copy").disabled = true;
  $("save").disabled = true;
  $("progress").value = 0;
  let worker;
  try {
    $("status").textContent = "OCR 엔진을 준비하고 있습니다. 처음 실행할 때는 시간이 걸릴 수 있습니다.";
    worker = await Tesseract.createWorker($("language").value, 1, {
      workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
      corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
      langPath: "https://tessdata.projectnaptha.com/4.0.0",
      gzip: true,
      logger: message => {
        if (message.status) $("status").textContent = "진행 상태: " + message.status;
        if (typeof message.progress === "number") $("progress").value = message.progress;
      }
    });
    const result = await worker.recognize(selectedFile);
    $("output").value = result.data.text || "인식된 문자가 없습니다. 이미지가 선명한지 확인해 주세요.";
    $("progress").value = 1;
    $("status").textContent = "문자 인식이 완료되었습니다.";
  } catch (error) {
    console.error(error);
    $("status").textContent = "인식 중 오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. (" + (error && error.message ? error.message : "알 수 없는 오류") + ")";
  } finally {
    if (worker) {
      try { await worker.terminate(); } catch (error) { console.warn(error); }
    }
    button.disabled = false;
    $("copy").disabled = false;
    $("save").disabled = false;
  }
});

$("copy").addEventListener("click", async () => {
  const value = $("output").value;
  if (!value.trim()) {
    $("status").textContent = "복사할 결과가 없습니다.";
    return;
  }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
    } else {
      $("output").focus();
      $("output").select();
      const copied = document.execCommand("copy");
      if (!copied) throw new Error("copy unavailable");
    }
    $("status").textContent = "인식 결과를 복사했습니다.";
  } catch (error) {
    $("output").focus();
    $("output").select();
    $("status").textContent = "복사가 자동으로 되지 않았습니다. 선택된 문자를 길게 눌러 복사해 주세요.";
  }
});

$("save").addEventListener("click", () => {
  const value = $("output").value;
  if (!value.trim()) {
    $("status").textContent = "저장할 결과가 없습니다.";
    return;
  }
  const blob = new Blob(["\uFEFF", value], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "GPT-OCR-result.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("status").textContent = "TXT 파일 저장을 시작했습니다.";
});

window.addEventListener("beforeunload", () => {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
});
</script>
</body>
</html>
